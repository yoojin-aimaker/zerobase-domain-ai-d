<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2주차 / 5분 PRD 워크북</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4fb;color:#25212d;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;line-height:1.6}main{max-width:1200px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;margin:4px 0 12px}h2{font-size:23px;margin:0 0 18px}.kicker,a{color:#7048b5}.timer{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.button{background:#7048b5;color:white;border:0;border-radius:5px;font:inherit;font-weight:600;padding:10px 16px;cursor:pointer;text-decoration:none}.quiet{background:white;color:#7048b5;border:1px solid #d3c3e8}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:26px}section{background:white;padding:26px;border:1px solid #e1dde7;border-radius:6px}label.field{display:block;font-size:17px;font-weight:700;margin-bottom:19px}textarea,input[type=text]{display:block;width:100%;border:1px solid #d7cce4;border-radius:4px;padding:10px;font:inherit;font-size:16px;resize:vertical;margin-top:7px}textarea:focus,input:focus{outline:2px solid #7048b5;outline-offset:2px}.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee7f8}.check input{width:20px;height:20px;accent-color:#7048b5;margin-top:4px}.check strong{display:block}.check small{font-size:14px;color:#63596d}#status{font-size:15px;color:#7048b5;min-height:24px}#progress{font-size:20px;color:#7048b5;font-weight:700}.note{font-size:15px;color:#63596d}a:focus-visible,button:focus-visible{outline:2px solid #7048b5;outline-offset:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}header{align-items:flex-start}main{padding:24px 16px}h1{font-size:27px}}@media print{body{background:white}.actions,.timer,#start{display:none}main{padding:0}section{break-inside:avoid}}</style><main><header><div><div class="kicker">WEEK 02 / PRD WORKBOOK</div><h1>5분 동안 내 PRD를 작성하고 확인합니다</h1><div class="note">지난주 MD와 멘토 피드백에서 채택한 수정 하나를 사용합니다.</div></div><div><div class="timer" id="timer">05:00</div><button id="start">타이머 시작</button></div></header><div class="grid"><section><h2>내 PRD 한 장</h2><label class="field">프로젝트 이름<input type="text" data-field="project" placeholder="기존 프로젝트 이름"></label><label class="field">WHO / 사용자와 장면<textarea rows="2" data-field="who" placeholder="누가, 언제, 어떤 결정을 하나요?"></textarea></label><label class="field">WHY / 문제와 근거<textarea rows="3" data-field="why" placeholder="확인한 불편과 원문 근거, 아직 모르는 가정을 나눠 적으세요."></textarea></label><label class="field">FEEDBACK / 채택한 의견과 수정<textarea rows="2" data-field="feedback" placeholder="받은 의견 하나 → 내가 바꿀 요구와 이유"></textarea></label><label class="field">WHAT / 목표와 첫 기능<textarea rows="2" data-field="what" placeholder="이번에 바꿀 행동 하나와 사용자가 할 수 있어야 할 일"></textarea></label><label class="field">INPUT → OUTPUT / 실제 자료와 결과<textarea rows="2" data-field="io" placeholder="받을 자료와 내보낼 결과, 필요한 원문 근거"></textarea></label><label class="field">ROLE / AI와 사람의 역할<textarea rows="2" data-field="role" placeholder="AI가 맡을 행동과 사람이 확인하고 결정할 일"></textarea></label><label class="field">SCOPE / 포함과 제외<textarea rows="2" data-field="scope" placeholder="이번에 만드는 범위와 다음으로 미룰 일"></textarea></label><label class="field">DONE / 정상과 예외의 완료 기준<textarea rows="3" data-field="done" placeholder="정상 입력, 빈 입력 또는 누락에서 기대하는 행동과 확인 방법"></textarea></label><div class="actions"><button id="copy">내 PRD 복사</button><button id="download">PRD.md 저장</button><button class="quiet" id="print">인쇄 / PDF</button></div><p id="status" aria-live="polite"></p></section><section><h2>빠진 내용은 없나요?</h2><div id="checks"></div><p id="progress"></p><label class="field">아직 확인할 질문<textarea data-field="open" rows="5" placeholder="없는 사용자 근거, 아직 구하지 못한 자료, 다음에 시험할 조건"></textarea></label><p class="note">확인하지 않은 불편과 효과는 질문으로 남깁니다. 작성 내용과 체크 상태는 이 브라우저에 자동 저장됩니다.</p></section></div></main><script>
const labels={project:'프로젝트 이름',who:'사용자와 장면',why:'문제와 근거',feedback:'채택한 피드백과 수정',what:'목표와 첫 기능',io:'입력과 결과',role:'AI와 사람의 역할',scope:'포함과 제외',done:'완료 기준',open:'미확정 질문'};
const checkItems=[['WHO','사용자와 실제 장면이 구체적이다.','직무 이름만 적지 않았나요?'],['EVIDENCE','확인한 근거와 내 가정을 나눴다.','원문이나 관찰 기록을 설명할 수 있나요?'],['FEEDBACK','채택한 피드백이 요구사항에 반영됐다.','무엇을 왜 바꿨나요?'],['FEATURE','첫 기능 하나를 정했다.','이번에 끝낼 일을 하나로 말할 수 있나요?'],['I/O','입력 자료와 결과가 연결된다.','그 결과에 필요한 항목이 입력에 있나요?'],['ROLE','AI와 사람의 담당이 나뉜다.','최종 결정을 누가 하나요?'],['SCOPE','이번에 제외할 일을 적었다.','추가 기능이 첫 시험을 막지 않나요?'],['DONE','정상과 누락의 완료 기준이 있다.','자료가 없을 때 어떻게 처리하나요?']];
const checks=document.querySelector('#checks');checkItems.forEach(([key,text,sub],i)=>{const l=document.createElement('label');l.className='check';const c=document.createElement('input');c.type='checkbox';c.dataset.check=String(i);const d=document.createElement('div');const b=document.createElement('strong');b.textContent=key+' / '+text;const s=document.createElement('small');s.textContent=sub;d.append(b,s);l.append(c,d);checks.append(l)});
const fields=[...document.querySelectorAll('[data-field]')],boxes=[...document.querySelectorAll('[data-check]')];const storageKey='zero-week2-prd-workbook-v1';
function progress(){document.querySelector('#progress').textContent=boxes.filter(b=>b.checked).length+' / '+boxes.length+' 확인'}
function save(){const data={fields:Object.fromEntries(fields.map(f=>[f.dataset.field,f.value])),checks:boxes.map(b=>b.checked)};try{localStorage.setItem(storageKey,JSON.stringify(data))}catch{}progress()}
try{const data=JSON.parse(localStorage.getItem(storageKey)||'{}');fields.forEach(f=>{if(typeof data.fields?.[f.dataset.field]==='string')f.value=data.fields[f.dataset.field]});boxes.forEach((b,i)=>b.checked=data.checks?.[i]===true)}catch{}fields.forEach(f=>f.addEventListener('input',save));boxes.forEach(b=>b.addEventListener('change',save));progress();
function md(){return '# '+(document.querySelector('[data-field=project]').value.trim()||'내 프로젝트')+' PRD\n\n'+fields.filter(f=>f.dataset.field!=='project').map(f=>'## '+labels[f.dataset.field]+'\n'+(f.value.trim()||'[작성 필요]')+'\n').join('\n')+'\n## 작성 확인\n'+checkItems.map((x,i)=>'- ['+(boxes[i].checked?'x':' ')+'] '+x[1]).join('\n')+'\n'}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
document.querySelector('#copy').onclick=async()=>{await copy(md());document.querySelector('#status').textContent='내 PRD를 복사했습니다.'};document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([md()],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='PRD.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);document.querySelector('#status').textContent='PRD.md를 저장했습니다.'};document.querySelector('#print').onclick=()=>window.print();let remaining=300,interval=null;function display(){document.querySelector('#timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')};document.querySelector('#start').onclick=()=>{if(interval){clearInterval(interval);interval=null;document.querySelector('#start').textContent='계속';return}if(remaining===0)remaining=300;document.querySelector('#start').textContent='잠깐 멈춤';interval=setInterval(()=>{remaining--;display();if(remaining<=0){clearInterval(interval);interval=null;document.querySelector('#start').textContent='다시 시작';document.querySelector('#status').textContent='작성한 PRD와 오른쪽 체크리스트를 확인해 주세요.'}},1000)};
</script></html>
