<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agentic loop" viewBox="0 0 1120 350"><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#7048b5"/></marker></defs><rect width="1120" height="350" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="0" y="30" font-size="24" fill="#63596d">목표와 지침 안에서 다음 행동을 선택합니다</text><path d="M220 140 H296" stroke="#7048b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M520 140 H596" stroke="#7048b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M820 140 H896" stroke="#7048b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1010 215 V270 H410 V220" stroke="#7048b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="0" y="65" width="220" height="150" rx="5" fill="white" stroke="#bea3d5" stroke-width="2"/><text x="110" y="124" text-anchor="middle" font-size="29" font-weight="700" fill="#25212d">자료 확인</text><text x="110" y="174" text-anchor="middle" font-size="23" fill="#63596d">원문과 지침 읽기</text><rect x="300" y="65" width="220" height="150" rx="5" fill="#ede5f8" stroke="#bea3d5" stroke-width="2"/><text x="410" y="124" text-anchor="middle" font-size="29" font-weight="700" fill="#25212d">다음 행동 선택</text><text x="410" y="174" text-anchor="middle" font-size="23" fill="#63596d">지금 필요한 작업은?</text><rect x="600" y="65" width="220" height="150" rx="5" fill="white" stroke="#bea3d5" stroke-width="2"/><text x="710" y="124" text-anchor="middle" font-size="29" font-weight="700" fill="#25212d">실행</text><text x="710" y="174" text-anchor="middle" font-size="23" fill="#63596d">필요한 도구로 작업</text><rect x="900" y="65" width="220" height="150" rx="5" fill="white" stroke="#bea3d5" stroke-width="2"/><text x="1010" y="124" text-anchor="middle" font-size="29" font-weight="700" fill="#25212d">결과 확인</text><text x="1010" y="174" text-anchor="middle" font-size="23" fill="#63596d">실제 결과를 관찰</text><rect x="535" y="251" width="350" height="38" fill="white"/><text x="710" y="279" text-anchor="middle" font-size="25" font-weight="700" fill="#7048b5">더 할 일이 있으면 반복</text><text x="560" y="338" text-anchor="middle" font-size="25" fill="#25212d">완료하면 결과 반환 / 자료가 부족하거나 한도에 닿으면 멈춤</text></g></svg>