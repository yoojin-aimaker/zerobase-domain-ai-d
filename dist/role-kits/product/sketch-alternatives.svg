<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#faf9fc"/><g font-family="sans-serif" fill="#25212d"><text x="45" y="55" font-size="29">제품디자인 / 수업용 콘셉트 스케치</text><text x="45" y="95" font-size="19">가상 관찰 기반 구성 예시. 실제 제품 도면, 치수, 제조성과 안전성 검증이 아닙니다.</text><text x="65" y="160" font-size="25">대안 A / 모드 구분 단서</text><text x="650" y="160" font-size="25">대안 B / 물받이 분리 단서</text></g><g stroke="#7048b5" fill="none" stroke-width="3"><rect x="140" y="190" width="280" height="370" rx="20"/><rect x="725" y="190" width="280" height="370" rx="20"/><path d="M160 370 H400 M745 370 H985 M260 330 V390 H285 M845 330 V390 H870"/><rect x="185" y="260" width="80" height="42"/><rect x="290" y="260" width="80" height="42"/><circle cx="800" cy="281" r="15"/><circle cx="925" cy="281" r="15"/><path d="M170 510 H390 V540 H170 Z M755 510 H975 V540 H755 Z M790 520 H940 M865 550 V600 M850 580 L865 600 L880 580"/><path d="M70 330 L180 280 M1080 480 L960 520" stroke-dasharray="7 5"/></g><g font-family="sans-serif" fill="#63596d" font-size="20"><text x="194" y="288">상온수</text><text x="306" y="288">온수</text><text x="50" y="365">U01: 모드 이름과</text><text x="50" y="393">구분 단서 배치</text><text x="960" y="450">U02: 잡는 위치와</text><text x="960" y="478">분리 방향 표시</text><text x="55" y="650">비교할 행동: 설명서 없이 모드를 고를 수 있는가?</text><text x="640" y="650">비교할 행동: 잡는 위치와 방향을 찾는가?</text><text x="55" y="705">학습자 작업: 두 대안의 원문 근거와 제약을 대조하고, 직접 수정한 스케치와 선택 이유를 남기세요.</text></g></svg>