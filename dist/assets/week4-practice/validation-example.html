<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검증 기록 / 로컬 실습 예제</title><style>*{box-sizing:border-box}body{font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;margin:0;background:#f4f2f8;color:#25212d}main{width:min(900px,calc(100% - 40px));margin:48px auto}header{background:#7048b5;color:white;padding:32px}h1{margin:12px 0;font-size:34px}header p{line-height:1.6}form,section{background:white;padding:28px;margin-top:20px;border:1px solid #e1dde7}label{display:block;margin:16px 0 8px;font-weight:700}input,textarea{display:block;font:inherit;padding:12px;width:100%;border:1px solid #bea3d5;border-radius:4px}button{font:inherit;background:#7048b5;color:white;border:0;padding:12px 18px;margin-top:20px;border-radius:4px;cursor:pointer}#message{min-height:26px;color:#512790;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:16px;text-align:left;border-bottom:1px solid #e1dde7;overflow-wrap:anywhere}caption{text-align:left;font-weight:800;margin-bottom:18px}small{line-height:1.6;color:#63596d}footer{margin:20px 0;font-size:14px;color:#63596d}@media(max-width:600px){main{width:calc(100% - 24px);margin:20px auto}form,section,header{padding:20px}h1{font-size:28px}.table-wrap{overflow:auto}}</style></head><body><main><header><span>WEEK 04 / WORKING EXAMPLE</span><h1>프로젝트 검증 기록</h1><p>기대 결과와 실제 결과를 비교해 내 판단을 기록합니다.</p></header><form id="form" novalidate><small>학습용 가상 데이터만 사용하세요. 외부 서버와 DB에 연결하지 않습니다.</small><label for="item">검증 항목</label><input id="item" placeholder="예: 빈 입력 처리" maxlength="80"><label for="expected">기대 결과</label><input id="expected" placeholder="예: 항목을 입력해주세요" maxlength="120"><label for="observed">실제 결과</label><input id="observed" placeholder="예: 항목을 입력해주세요" maxlength="120"><button type="submit">비교 기록 추가</button><p id="message" role="status"></p></form><section><div class="table-wrap"><table><caption>이번 화면에서 확인한 기록</caption><thead><tr><th>검증 항목</th><th>기대 결과</th><th>실제 결과</th><th>판정</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>탭 메모리에만 남습니다. 새로고침하면 기록은 사라집니다. 여러 사람의 입력을 함께 저장하려면 별도의 서버와 DB가 필요합니다.</footer><a href="../../week4_practice.html#a5">실습 가이드로 돌아가기</a></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();let ids=['item','expected','observed'],values=ids.map(id=>document.getElementById(id).value.trim()),message=document.getElementById('message');let missing=values.findIndex(v=>!v);if(missing>=0){message.textContent=['검증 항목','기대 결과','실제 결과'][missing]+'을 입력해주세요.';document.getElementById(ids[missing]).focus();return}let row=document.createElement('tr');[...values,values[1]===values[2]?'통과':'재확인'].forEach(v=>{let cell=document.createElement('td');cell.textContent=v;row.append(cell)});document.getElementById('rows').append(row);message.textContent='비교 기록 1건을 추가했습니다. 직접 결과를 확인하세요.'};</script></body></html>
